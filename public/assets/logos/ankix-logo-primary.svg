<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F59B" />
      <stop offset="50%" stop-color="#00D8F6" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142038" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>
    <linearGradient id="ballShade" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF334B" />
      <stop offset="50%" stop-color="#A81420" />
      <stop offset="100%" stop-color="#4A050A" />
    </linearGradient>

    <!-- Filters -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ICON SHIELD EMBLEM -->
  <g transform="translate(15, 10)">
    <!-- Base Shield -->
    <rect width="100" height="100" rx="26" fill="url(#shieldGrad)" />
    <rect x="1.5" y="1.5" width="97" height="97" rx="24.5" stroke="#1E2D4A" stroke-width="2.5" />
    <rect x="4" y="4" width="92" height="92" rx="22" stroke="url(#primaryAura)" stroke-width="1" stroke-opacity="0.3" />

    <!-- Angular Monogram 'A' / Stumps Motif -->
    <path d="M50 16 L76 78 L62 78 L54 58 L46 58 L38 78 L24 78 Z" fill="url(#primaryAura)" filter="url(#emeraldGlow)" />
    <polygon points="50,34 57,50 43,50" fill="#070B14" />

    <!-- 3D Cricket Ball Centerpiece -->
    <circle cx="50" cy="41" r="5.5" fill="url(#ballShade)" />
    <!-- Ball Seam Stitching -->
    <path d="M46 39.5 C48 41.5 50 41.5 54 42.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1.5 1.2" />
    <!-- Ball Glow Ring -->
    <circle cx="50" cy="41" r="7" stroke="#00F59B" stroke-width="0.8" stroke-opacity="0.6" />
  </g>

  <!-- BRAND TYPOGRAPHY -->
  <g transform="translate(135, 30)">
    <!-- ANKIX -->
    <text x="0" y="42" font-family="'Outfit', 'Inter', sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" letter-spacing="2">
      ANKIX
    </text>

    <!-- SPORTS WITH ELECTRIC EMERALD GLOW -->
    <text x="175" y="42" font-family="'Outfit', 'Inter', sans-serif" font-size="46" font-weight="900" fill="#00F59B" letter-spacing="4" filter="url(#emeraldGlow)">
      SPORTS
    </text>

    <!-- TAGLINE -->
    <text x="3" y="65" font-family="'JetBrains Mono', 'Roboto Mono', monospace" font-size="12" font-weight="700" fill="#8A99AD" letter-spacing="4">
      EVERY RUN. EVERY MOMENT.
    </text>

    <!-- Horizontal Sports Speed Dash -->
    <line x1="225" y1="61" x2="330" y2="61" stroke="url(#primaryAura)" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
