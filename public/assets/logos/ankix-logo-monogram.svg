<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="monoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F59B" />
      <stop offset="40%" stop-color="#00D8F6" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="monoBg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#152238" />
      <stop offset="60%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#070B14" />
    </radialGradient>
    <radialGradient id="ballShade2" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF334B" />
      <stop offset="45%" stop-color="#A81420" />
      <stop offset="85%" stop-color="#5E0B12" />
      <stop offset="100%" stop-color="#300307" />
    </radialGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="256" height="256" rx="64" fill="url(#monoBg)" />
  <rect x="3" y="3" width="250" height="250" rx="61" stroke="#1E2D4A" stroke-width="4" />
  <rect x="8" y="8" width="240" height="240" rx="56" stroke="url(#monoGrad)" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Stadium Floodlight Beams (subtle) -->
  <path d="M40 30 L128 140 L216 30" stroke="url(#monoGrad)" stroke-width="1" stroke-opacity="0.15" />

  <!-- Angular Monogram 'A' Motif (Large, Bold, Iconic) -->
  <path d="M128 42 L198 202 L162 202 L142 152 L114 152 L94 202 L58 202 Z" fill="url(#monoGrad)" filter="url(#badgeGlow)" />
  <polygon points="128,88 146,132 110,132" fill="#070B14" />

  <!-- Centerpiece Cricket Ball -->
  <circle cx="128" cy="106" r="14" fill="url(#ballShade2)" />
  <ellipse cx="128" cy="106" rx="14" ry="4" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="3 2" transform="rotate(-30 128 106)" />
  <circle cx="128" cy="106" r="18" stroke="#00F59B" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Bottom Brand Text -->
  <text x="128" y="234" font-family="'Outfit', sans-serif" font-size="16" font-weight="900" fill="#00F59B" text-anchor="middle" letter-spacing="6">
    ANKIX
  </text>
</svg>
