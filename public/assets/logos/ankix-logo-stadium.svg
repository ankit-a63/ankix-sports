<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <defs>
    <linearGradient id="stadiumGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F59B" />
      <stop offset="50%" stop-color="#00D8F6" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="stadiumDark" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#142038" />
      <stop offset="70%" stop-color="#090E1A" />
      <stop offset="100%" stop-color="#070B14" />
    </radialGradient>
    <radialGradient id="ballRed" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF334B" />
      <stop offset="45%" stop-color="#A81420" />
      <stop offset="85%" stop-color="#5E0B12" />
      <stop offset="100%" stop-color="#300307" />
    </radialGradient>
    <filter id="stadiumGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Stadium Crest Shield -->
  <path d="M150 15 L260 55 L235 210 L150 280 L65 210 L40 55 Z" fill="url(#stadiumDark)" stroke="#1E2D4A" stroke-width="4" />
  <path d="M150 25 L248 61 L226 200 L150 265 L74 200 L52 61 Z" stroke="url(#stadiumGold)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Stadium Floodlight Rays -->
  <path d="M150 35 L190 120 L150 100 L110 120 Z" fill="url(#stadiumGold)" opacity="0.12" />

  <!-- Crossed Cricket Bats in Background -->
  <g stroke="#2A3C5F" stroke-width="4" stroke-linecap="round">
    <line x1="85" y1="85" x2="215" y2="215" />
    <line x1="215" y1="85" x2="85" y2="215" />
  </g>

  <!-- Center Hexagonal Frame -->
  <polygon points="150,75 195,102 195,158 150,185 105,158 105,102" fill="#070B14" stroke="url(#stadiumGold)" stroke-width="2.5" filter="url(#stadiumGlow)" />

  <!-- Cricket Ball Core -->
  <circle cx="150" cy="130" r="22" fill="url(#ballRed)" />
  <ellipse cx="150" cy="130" rx="22" ry="7" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="4 3" transform="rotate(-35 150 130)" />
  <circle cx="150" cy="130" r="26" stroke="#00F59B" stroke-width="1" stroke-opacity="0.7" />

  <!-- Brand Typography on Ribbon -->
  <rect x="50" y="215" width="200" height="34" rx="10" fill="#070B14" stroke="#1E2D4A" stroke-width="2" />
  <text x="150" y="238" font-family="'Outfit', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">
    ANKIX <tspan fill="#00F59B">SPORTS</tspan>
  </text>
  <text x="150" y="258" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#8A99AD" text-anchor="middle" letter-spacing="2">
    EST. 2026
  </text>
</svg>
