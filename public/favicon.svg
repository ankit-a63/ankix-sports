<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ankixGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F59B" />
      <stop offset="100%" stop-color="#00D8F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect width="64" height="64" rx="16" fill="#070B14" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#1E2D4A" stroke-width="1.5" />
  
  <!-- Geometric 'A' / Cricket Stumps & Seam Motif -->
  <path d="M32 10 L48 50 L39 50 L34 37 L30 37 L25 50 L16 50 Z" fill="url(#ankixGrad)" />
  <polygon points="32,23 36,33 28,33" fill="#070B14" />
  
  <!-- Electric Emerald Ball Accent -->
  <circle cx="32" cy="27" r="3.5" fill="#00F59B" filter="url(#glow)" />
  <!-- Ball Seam Stitch Curve -->
  <path d="M30 25.5 C31.5 27 32.5 27 34 28.5" stroke="#070B14" stroke-width="1" stroke-linecap="round" />
</svg>